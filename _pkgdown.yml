url: https://statzhero.github.io/wrds/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#b51236"
    navbar-light-bg: "#13547a"
    navbar-dark-bg: "#0e3f5c"
    navbar-light-color: "#ffffff"
    navbar-dark-color: "#e0e0e0"

navbar:
  structure:
    left: [intro, home, reference, news]
    right: [search, github, lightswitch]
  components:
    home:
      text: Readme
      href: index.html
    news:
      text: News
      href: news/index.html

footer:
  structure:
    left: developed_by
    right: built_with

home:
  sidebar:
    structure: [links, community, citation, authors, dev, license]

